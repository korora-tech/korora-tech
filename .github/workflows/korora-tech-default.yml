# Generated by cuenv - do not edit manually
# Regenerate with: cuenv sync ci

name: korora-tech-default
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/korora-tech-default.yml
    - astro.config.mjs
    - astro.config.mjs/**
    - bun.lock
    - bun.lock/**
    - cue.mod/**
    - env.cue
    - package.json
    - package.json/**
    - public/**
    - schema/**
    - src/**
    - tsconfig.json
    - tsconfig.json/**
    - wrangler.jsonc
    - wrangler.jsonc/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  korora-tech-default:
    permissions:
      contents: read
      checks: write
      packages: write
      id-token: write
    name: korora-tech-default
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup cuenv (release)
      run: |-
        arch="$(uname -m)"
        case "$arch" in
          x86_64|amd64) cuenv_asset="cuenv-linux-x64" ;;
          aarch64|arm64) cuenv_asset="cuenv-linux-arm64" ;;
          *) echo "Unsupported Linux architecture: $arch" >&2; exit 1 ;;
        esac
        cuenv_version="0.61.0"
        if [ -z "$cuenv_version" ]; then
          cuenv_version="latest"
        fi
        if [ "$cuenv_version" = "latest" ]; then
          cuenv_url="https://github.com/cuenv/cuenv/releases/latest/download/${cuenv_asset}"
        else
          cuenv_url="https://github.com/cuenv/cuenv/releases/download/${cuenv_version}/${cuenv_asset}"
        fi
        curl -fsSL -o /usr/local/bin/cuenv "$cuenv_url" && chmod +x /usr/local/bin/cuenv && /usr/local/bin/cuenv sync -A
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: cuenv:contributor:bun.workspace.setup
      run: 'true'
    - name: Get GitHub OIDC token for Infisical
      run: |-
        set -eu
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::No GitHub Actions OIDC token endpoint: the job needs 'id-token: write' and must run on GitHub Actions" >&2
          exit 1
        fi
        if [ -z "${INFISICAL_MACHINE_IDENTITY_ID:-}" ]; then
          echo "::error::INFISICAL_MACHINE_IDENTITY_ID is empty: add the repository secret or set #identityId on #InfisicalOidc" >&2
          exit 1
        fi
        request_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
        audience=''
        if [ -n "$audience" ]; then
          request_url="${request_url}&audience=$(jq -rn --arg value "$audience" '$value|@uri')"
        fi
        jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$request_url" | jq -r '.value // empty')"
        if [ -z "$jwt" ]; then
          echo "::error::GitHub Actions returned no OIDC token" >&2
          exit 1
        fi
        # A line break in a value would let it set other variables (and break
        # ::add-mask::), so refuse it without printing the value.
        has_line_break() { [ "$(printf '%s' "$1" | tr -d '\r\n')" != "$1" ]; }
        if has_line_break "$INFISICAL_MACHINE_IDENTITY_ID"; then
          echo "::error::INFISICAL_MACHINE_IDENTITY_ID contains a line break; check the secret or #identityId" >&2
          exit 1
        fi
        if has_line_break "$jwt"; then
          echo "::error::GitHub Actions returned an OIDC token containing a line break" >&2
          exit 1
        fi
        echo "::add-mask::${jwt}"
        echo "::add-mask::${INFISICAL_MACHINE_IDENTITY_ID}"
        delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'INFISICAL_AUTH_JWT<<%s\n%s\n%s\n' "$delimiter" "$jwt" "$delimiter"
          printf 'INFISICAL_MACHINE_IDENTITY_ID<<%s\n%s\n%s\n' "$delimiter" "$INFISICAL_MACHINE_IDENTITY_ID" "$delimiter"
        } >> "$GITHUB_ENV"
      env:
        INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
    - name: Install Bun dependencies
      run: cuenv exec -- bun install --frozen-lockfile
    - name: Setup Infisical
      run: cuenv exec -- cuenv secrets setup infisical
      env:
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_ORGANIZATION_SLUG: ${{ secrets.INFISICAL_ORGANIZATION_SLUG }}
        INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
    - name: 'Run pipeline: default'
      run: cuenv ci --pipeline default --path .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF_TYPE: ${{ github.ref_type }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        CUENV_ENVIRONMENT: production
        INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
        INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
        INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        INFISICAL_ORGANIZATION_SLUG: ${{ secrets.INFISICAL_ORGANIZATION_SLUG }}
        INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
